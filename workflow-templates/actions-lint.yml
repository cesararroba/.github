name: 'CI: Actions Lint'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '30 06 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: cesararroba/.github/.github/workflows/reusable-actionlint.yml@22cb2bbd9257c85ecd16857ad02c6beebdcad5d3 # v1.0.0

  zizmor:
    name: Zizmor
    permissions:
      contents: read
    uses: cesararroba/.github/.github/workflows/reusable-zizmor.yml@22cb2bbd9257c85ecd16857ad02c6beebdcad5d3 # v1.0.0
